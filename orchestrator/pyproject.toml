[project]
name = "mrag-orchestrator"
version = "0.1.0"
description = "MRAG top-level orchestrator: sample detection + DAG execution + cross-variant synthesis"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
mrag = "mrag_orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrag_orchestrator"]
