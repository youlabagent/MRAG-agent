[project]
name = "alphagenome-mcp"
version = "0.1.0"
description = "MRAG AlphaGenome MCP server: in silico TF binding-site validation"
license = {text = "MIT"}
requires-python = ">=3.10"
# Heavy deps (alphagenome SDK 0.6.1, numpy, pandas) live in
# /BIO1/MRAG/Agent/libs/alphagenome_client/.venv. alphagenome_client is editable-
# installed there. We only need mcp[cli] on top.
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
alphagenome-mcp = "alphagenome_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphagenome_mcp"]
