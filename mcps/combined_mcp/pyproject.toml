[project]
name = "combined-mcp"
version = "0.1.0"
description = "MRAG combined p-value (Stouffer) + Top-N TF selection MCP server"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
combined-mcp = "combined_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/combined_mcp"]
