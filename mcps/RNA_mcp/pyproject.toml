[project]
name = "rna-mcp"
version = "0.1.0"
description = "RNA-seq pipeline MCP server with AI-powered automation (pydeseq2 + matplotlib)"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pydeseq2>=0.5",
]

[project.scripts]
rna-mcp = "rna_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rna_mcp"]
