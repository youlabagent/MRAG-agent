[project]
name = "homer-mcp"
version = "0.1.0"
description = "MRAG HOMER MCP server: motif find + annotate + target TF filter"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pandas>=2.0",
]

[project.scripts]
homer-mcp = "homer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homer_mcp"]
