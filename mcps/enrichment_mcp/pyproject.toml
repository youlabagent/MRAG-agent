[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enrichment_mcp"
version = "0.1.0"
description = "MRAG enrichment MCP: GO/Hallmark/Reactome enrichment on TF target gene sets"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "gseapy>=1.2", "mcp", "fastmcp"]

[tool.setuptools.packages.find]
where = ["src"]
