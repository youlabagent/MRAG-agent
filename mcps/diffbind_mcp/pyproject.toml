[project]
name = "diffbind-mcp"
version = "0.1.0"
description = "MRAG DiffBind MCP server: R Bioconductor DiffBind subprocess wrap"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pandas>=2.0",
]

[project.scripts]
diffbind-mcp = "diffbind_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffbind_mcp"]

# Ship the bundled R script as package data so subprocess can find it.
[tool.hatch.build.targets.wheel.force-include]
"src/diffbind_mcp/scripts/run_diffbind.R" = "diffbind_mcp/scripts/run_diffbind.R"
