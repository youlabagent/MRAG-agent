[project]
name = "trn-mcp"
version = "0.1.0"
description = "MRAG TRN MCP server: integrate HOMER + DiffBind + DESeq2 -> TFs.Pval3.txt"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
trn-mcp = "trn_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trn_mcp"]
