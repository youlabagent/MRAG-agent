[project]
name = "alphagenome-client"
version = "0.1.0"
description = "Thin Python wrapper around AlphaGenome SDK for the MRAG pipeline"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["alphagenome>=0.6.1"]

[project.scripts]
ag = "alphagenome_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphagenome_client"]
